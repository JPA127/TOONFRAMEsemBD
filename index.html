
  <!DOCTYPE html>
  <html lang="pt-BR">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="color-scheme" content="light dark" />
      <script>
        // aplica o tema antes da página aparecer (evita piscar branco no modo escuro)
        (function () {
          try {
            var saved = localStorage.getItem('toonframe_theme');
            var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (dark) {
              document.documentElement.classList.add('dark');
              document.documentElement.style.colorScheme = 'dark';
            }
          } catch (e) {}
        })();
      </script>
      <title>Toonframe Animation App</title>
      <meta name="description" content="Discover the latest news and reviews in animation with a sleek black and white interface, enhanced by vibrant accents, tailored for animation enthusiasts." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
